<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光耀門楣 · 李晴雅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #ffd700;
      --gold-light: #ffe566;
      --crimson: #8b0000;
      --deep-red: #1a0505;
      --neon-red: #ff1744;
      --neon-gold: #ffea00;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--deep-red);
      font-family: 'Noto Serif TC', serif;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(139, 0, 0, 0.9) 0%, transparent 70%),
        radial-gradient(ellipse 100% 100% at 50% 100%, rgba(255, 23, 68, 0.15) 0%, transparent 50%),
        linear-gradient(160deg, #0d0202 0%, #1a0505 30%, #2d0a0a 60%, #0d0202 100%);
    }

    /* Particle canvas */
    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Ambient glow orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 300px; height: 300px; background: var(--neon-red); top: 10%; left: 15%; animation-delay: 0s; }
    .orb-2 { width: 250px; height: 250px; background: var(--gold); bottom: 15%; right: 10%; animation-delay: -3s; opacity: 0.25; }
    .orb-3 { width: 180px; height: 180px; background: #ff6b35; top: 60%; left: 5%; animation-delay: -5s; opacity: 0.2; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(20px, -30px) scale(1.05); }
      66% { transform: translate(-15px, 20px) scale(0.95); }
    }

    /* Main poster card */
    .poster {
      position: relative;
      width: min(92vw, 520px);
      aspect-ratio: 3 / 4.2;
      background:
        linear-gradient(145deg, rgba(139, 0, 0, 0.95) 0%, rgba(80, 0, 0, 0.98) 50%, rgba(100, 0, 10, 0.95) 100%);
      border: 2px solid transparent;
      border-image: linear-gradient(135deg, var(--gold), #b8860b, var(--gold-light), #b8860b) 1;
      box-shadow:
        0 0 60px rgba(255, 215, 0, 0.25),
        0 0 120px rgba(255, 23, 68, 0.15),
        inset 0 0 80px rgba(0, 0, 0, 0.4);
      display: grid;
      grid-template-columns: 1fr 2.2fr 1fr;
      grid-template-rows: auto 1fr auto;
      padding: 2rem 1.2rem;
      animation: posterReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: perspective(800px) rotateX(8deg) scale(0.92);
    }

    @keyframes posterReveal {
      to {
        opacity: 1;
        transform: perspective(800px) rotateX(0deg) scale(1);
      }
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 2px solid var(--gold);
      opacity: 0.8;
    }
    .corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    /* Scanline overlay */
    .poster::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      pointer-events: none;
    }

    /* Side columns */
    .side-col {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: clamp(0.65rem, 2.2vw, 0.78rem);
      color: rgba(255, 235, 200, 0.85);
      letter-spacing: 0.15em;
      line-height: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0;
      animation: fadeSlide 1s ease 0.6s both;
    }

    .side-col.left { animation-delay: 0.8s; }
    .side-col.right { animation-delay: 0.7s; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Center hero */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      grid-row: 1 / -1;
      grid-column: 2;
    }

    .badge {
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      color: var(--gold);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 0.35em 1em;
      background: rgba(255, 215, 0, 0.08);
      animation: badgePulse 2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
      50% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.5); }
    }

    .hero-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: clamp(3.5rem, 14vw, 5.5rem);
      line-height: 1;
      background: linear-gradient(
        180deg,
        #fff8e7 0%,
        var(--gold-light) 25%,
        var(--gold) 50%,
        #b8860b 75%,
        var(--gold-light) 100%
      );
      background-size: 100% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6))
              drop-shadow(0 0 40px rgba(255, 23, 68, 0.3));
      animation: shimmer 3s ease-in-out infinite, titlePop 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
      position: relative;
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 0%; }
      50% { background-position: 0% 100%; }
    }

    @keyframes titlePop {
      from { opacity: 0; transform: scale(0.5); filter: blur(10px); }
      to { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    .hero-title::before {
      content: '光耀門楣';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .name-block {
      text-align: center;
      animation: fadeSlide 1s ease 0.9s both;
    }

    .name {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 23, 68, 0.5);
      letter-spacing: 0.2em;
    }

    .name span {
      color: var(--neon-gold);
    }

    .achievement {
      margin-top: 0.6rem;
      font-size: clamp(0.65rem, 2vw, 0.75rem);
      color: rgba(255, 220, 180, 0.75);
      line-height: 1.8;
      max-width: 280px;
    }

    .divider {
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0.5rem auto;
      animation: dividerGrow 1s ease 1.1s both;
      transform-origin: center;
    }

    @keyframes dividerGrow {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    .exam-tag {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.4em 1em;
      font-size: clamp(0.6rem, 1.8vw, 0.7rem);
      color: var(--gold-light);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.3);
      letter-spacing: 0.1em;
      animation: fadeSlide 1s ease 1.2s both;
    }

    /* Confetti burst on load */
    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 8px;
      pointer-events: none;
      animation: confettiFall 3s ease-out forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* Footer credit */
    .footer-note {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: rgba(255, 215, 0, 0.35);
      letter-spacing: 0.2em;
      animation: fadeSlide 1s ease 1.5s both;
    }
  </style>
</head>
<body>
  <div class="scene">
    <canvas id="particles"></canvas>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="poster">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <div class="side-col left">
        新港鄉鄉長　林茂盛<br>溪北村村長　李明棟<br>敬賀
      </div>

      <div class="center">
        <div class="badge">恭 賀 及 第</div>
        <h1 class="hero-title">光耀門楣</h1>
        <div class="name-block">
          <div class="name">李<span>晴雅</span> 女士</div>
          <div class="divider"></div>
          <div class="achievement">
            考取 109 年<br>
            公務人員高等考試三級考試<br>
            暨普通考試<br>
            交通技術類科
          </div>
          <div class="exam-tag">★ 金榜題名 ★</div>
        </div>
      </div>

      <div class="side-col right">
        賀　李晴雅　女士<br>考取　109　年<br>公務人員高等考試<br>三級考試暨普通考試<br>交通技術類科
      </div>
    </div>
  </div>

  <div class="footer-note">溪北 30 · 新港鄉</div>

  <script>
    // Floating gold particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedY = Math.random() * 0.4 + 0.1;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.6 + 0.2;
        this.hue = Math.random() > 0.5 ? 45 : 350; // gold or red
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset(), this.y = canvas.height + 10;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${this.opacity})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 80; i++) particles.push(new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Confetti burst
    const colors = ['#ffd700', '#ff1744', '#ffea00', '#ff6b35', '#fff'];
    const scene = document.querySelector('.scene');
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.top = '-10px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        scene.appendChild(piece);
        setTimeout(() => piece.remove(), 5000);
      }, i * 30);
    }
  </script>
</body>
</html>
